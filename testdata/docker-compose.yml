# End-to-end check: loads the plugin from source into Traefik (Yaegi) in front of whoami.
#   docker compose up -d && ./e2e.sh && docker compose down
services:
  traefik:
    image: traefik:v3.6
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --experimental.localPlugins.subnetburst.moduleName=github.com/FoxxMD/traefik-subnet-burst
      - --log.level=INFO
    ports:
      - "18080:80"
    volumes:
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ..:/plugins-local/src/github.com/FoxxMD/traefik-subnet-burst:ro
  whoami:
    image: traefik/whoami
